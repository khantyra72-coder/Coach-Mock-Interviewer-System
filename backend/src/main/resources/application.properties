spring.application.name=AceInterviewBackend

# ---- MySQL connection ----
# No real credentials live in this file (it's committed to git). Values come
# from environment variables, with safe placeholder defaults as fallback.
# For local development, put your real values in application-local.properties
# instead (that file is gitignored and never committed).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/aceinterview?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:CHANGE_ME}

# Activates application-local.properties automatically when no
# SPRING_PROFILES_ACTIVE env var is set (e.g. in production/CI).
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ---- JPA / Hibernate ----
# update = Hibernate creates/updates tables to match the entities automatically.
# Good for development. Never use "update" (or "create") against a production database.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
